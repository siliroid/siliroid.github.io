<!doctype html>
<meta charset="utf-8">
<!-- ⛔ LOAD-BEARING, NOT HYGIENE. The Stripe session id arrives in this page's URL and is a
     bearer token until the key is claimed. Any off-origin request from this page leaks it in
     the Referer header. So: no-referrer, and this page loads NOTHING from another origin —
     no font, no analytics, no icon. If anything external is ever added here, the threat model
     in heat/claim.sql breaks and nobody will notice, because a leaked token and a safe one
     look identical right up until they don't. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your HEAT folio</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; background:#0d1117; color:#e6edf3; font:16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px }
  main { max-width:560px; width:100% }
  h1 { font-size:1.5rem; margin:0 0 .4rem }
  p { color:#9aa7b4; margin:.5rem 0 }
  .key { font:600 1.35rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em;
         background:#161b22; border:1px solid #30363d; border-radius:8px; padding:18px 20px; margin:1.4rem 0;
         word-break:break-all; color:#3fb6ad }
  button { background:#3fb6ad; color:#08201f; border:0; border-radius:6px; padding:11px 22px;
           font:600 .95rem/1 inherit; cursor:pointer }
  .warn { border-left:3px solid #d29922; padding-left:14px; color:#d29922; font-size:.92rem }
  .err  { border-left:3px solid #f85149; padding-left:14px; color:#f85149 }
  a { color:#3fb6ad }
</style>
<main>
  <h1 id="h">Unlocking your folio…</h1>
  <div id="body"></div>
</main>
<script src="config.js"></script>
<script>
(async () => {
  const h = document.getElementById('h'), body = document.getElementById('body');
  const sid = new URLSearchParams(location.search).get('session_id');

  const fail = (msg) => {
    h.textContent = 'Something went wrong';
    body.innerHTML = '<p class="err">' + msg + '</p>' +
      '<p>Your payment is safe — this is only the key handover. Mail ' +
      '<a href="mailto:cece@siliroid.ai">cece@siliroid.ai</a> with the time you paid and I will ' +
      'sort it by hand, same day.</p>';
  };

  if (!sid) return fail('No checkout session in the link.');

  /* Config comes from config.js (generated from .env by heat/build-config.js). The fallback
     is the exact literal that used to be inline here, so a missing config.js behaves like
     today rather than like nothing — and it warns, because this is the claim page and a
     silent misconfiguration here means somebody who paid cannot get their key. */
  const HC = window.HEAT_CONFIG || {};
  if (!window.HEAT_CONFIG) {
    console.warn("[heat] config.js did not load — using built-in fallback URL. Run: node heat/build-config.js");
    /* This is the page a person lands on AFTER paying, so it keeps going on the fallback —
       stranding a buyer is worse than a wrong URL. But it says so, on the page, because
       console.warn is a record nobody reads and "fell back" has looked exactly like
       "worked" from outside the browser the whole time. */
    const b = document.createElement("div");
    b.style.cssText = "background:#5a1f1f;color:#ffd9d9;padding:.6rem 1rem;font:14px/1.4 system-ui;text-align:center";
    b.textContent = "Config did not load — using a built-in fallback. If your key does not arrive, mail cece@siliroid.ai and I will sort it by hand.";
    document.body.prepend(b);
  }
  const SB = HC.SUPABASE_URL || 'https://udrbeucnxmojlvewmrbm.supabase.co';

  let r;
  try {
    r = await fetch(SB + '/functions/v1/heat-claim?session_id='
                    + encodeURIComponent(sid), { cache: 'no-store' });
  } catch (e) { return fail('Could not reach the key service.'); }

  /* ⛔ ONE MESSAGE FOR EVERY FAILURE, ON PURPOSE. Unknown session, already claimed and expired
     are indistinguishable server-side by design — saying "already claimed" here would hand
     back exactly the distinction the endpoint refuses to make, and turn this page into the
     oracle the function was built to avoid. */
  if (!r.ok) return fail('That link has already been used, or it has expired.');

  const j = await r.json().catch(() => null);
  if (!j || !j.ok || !j.key) return fail('That link has already been used, or it has expired.');

  h.textContent = 'Here is your key';
  body.innerHTML =
    '<p>Thank you — genuinely. You are the reason this exists.</p>' +
    '<div class="key" id="k"></div>' +
    '<button id="c">Copy</button>' +
    '<p class="warn">This is shown once and cannot be retrieved again. Save it somewhere now. ' +
    'If you lose it, mail me and I will reissue it — that is a promise, not a policy.</p>' +
    '<p>Paste it into the folio page to unlock your assessment.</p>';
  document.getElementById('k').textContent = j.key;
  document.getElementById('c').onclick = async (e) => {
    try { await navigator.clipboard.writeText(j.key); e.target.textContent = 'Copied'; }
    catch { e.target.textContent = 'Select it above'; }
  };

  /* Strip the session id from the address bar once spent — it is in history either way, but
     it stops the next screenshot, share or shoulder from carrying it. */
  history.replaceState(null, '', location.pathname);
})();
</script>

<script data-goatcounter="https://siliroid.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
